<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>still living</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #04050a;
    overflow: hidden;
    font-family: "Inter", system-ui, sans-serif;
    cursor: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .hud {
    position: fixed;
    bottom: 28px;
    left: 32px;
    color: rgba(255, 255, 255, 0.55);
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: lowercase;
    transition: opacity 3s ease;
    pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
  .hud.hidden { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud">waking up…</div>

<script id="frag" type="x-shader/x-fragment">
precision highp float;

uniform vec2  u_res;
uniform float u_time;
uniform float u_flow;    // overall tempo (wind)
uniform float u_warp;    // turbulence (wind)
uniform float u_warmth;  // -1 cold .. +1 warm (temperature)
uniform float u_soft;    // 0 crisp .. 1 soft (cloud cover)
uniform float u_wet;     // 0 dry .. 1 raining (precipitation)
uniform float u_snow;    // 0 .. 1 snowing
uniform float u_night;   // 0 day .. 1 night (sun position)
uniform float u_wmul;    // warp multiplier incl. breathing, computed in JS

// genome-driven parameters (see genome.json)
uniform vec3 u_dayA; uniform vec3 u_dayB; uniform vec3 u_dayD;
uniform vec3 u_nightA; uniform vec3 u_nightB; uniform vec3 u_nightD;
uniform vec3 u_tintWarm; uniform vec3 u_tintCool;
uniform vec3 u_starTint; uniform vec3 u_snowTint;
uniform float u_flowRate; uniform float u_warpPush;
uniform float u_expRate; uniform float u_expRange;
uniform float u_contrast; uniform float u_vig; uniform float u_grain;
uniform float u_starThresh; uniform float u_starSize; uniform float u_snowWash;
uniform float u_shade;

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
    mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
    u.y);
}

float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
  for (int i = 0; i < 5; i++) {
    v += a * noise(p);
    p = rot * p * 2.02;
    a *= 0.5;
  }
  return v;
}

vec3 pal(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
  return a + b * cos(6.28318 * (c * t + d));
}

float snowLayer(vec2 uv, float scale, float t, float size) {
  vec2 p = uv * scale;
  p.y += t * scale * 0.5;
  p.x += sin(p.y * 0.6 + t * 2.0) * 0.25;
  vec2 id = floor(p);
  vec2 f = fract(p) - 0.5;
  float rnd = hash(id);
  vec2 off = (vec2(rnd, fract(rnd * 34.7)) - 0.5) * 0.6;
  float d = length(f - off);
  float glow = 1.0 - smoothstep(0.0, size, d);
  return glow * glow * (0.4 + 0.6 * fract(rnd * 13.1));
}

void main() {
  vec2 uv = (gl_FragCoord.xy * 2.0 - u_res) / min(u_res.x, u_res.y);
  float t = u_time * u_flowRate * u_flow;

  float w = u_warp * u_wmul;

  // two-stage domain warp: the flow field the organism lives in
  vec2 q = vec2(
    fbm(uv + vec2(0.0, t)),
    fbm(uv + vec2(5.2, 1.3) - t * 0.71));
  vec2 r = vec2(
    fbm(uv + w * q + vec2(1.7, 9.2) + 0.150 * t),
    fbm(uv + w * q + vec2(8.3, 2.8) - 0.126 * t));
  // perpetual expansion: two zoom layers crossfading, so the field
  // always grows toward the viewer without ever visibly resetting
  float cycle = u_time * u_expRate * u_flow;
  float ph1 = fract(cycle);
  float ph2 = fract(cycle + 0.5);
  float s1 = exp2(mix(u_expRange, -u_expRange, ph1));
  float s2 = exp2(mix(u_expRange, -u_expRange, ph2));
  float w1 = 1.0 - abs(ph1 * 2.0 - 1.0);
  vec2 warp = w * r * u_warpPush;
  float f1 = fbm(uv * s1 + warp);
  float f2 = fbm(uv * s2 + warp + vec2(17.3, 9.1));
  float f = mix(f2, f1, w1);

  // Solidity is a lighting property, not a silhouette one: a body reads as solid
  // when it is lit from somewhere and shadows itself away from that light. Sample
  // the same density one step toward the light — denser there means something is
  // between us and it, thinner means this is the face turned into it. One extra
  // pair of taps buys the whole illusion, with no marching.
  // The light follows the sun the piece already tracks: overhead by day, raking
  // low across the field at night, swinging over the 80-minute dusk ramp.
  vec2 lightDir = normalize(mix(vec2(-0.34, 1.0), vec2(-0.92, 0.30), u_night));
  vec2 luv = uv + lightDir * 0.15;
  float l1 = fbm(luv * s1 + warp);
  float l2 = fbm(luv * s2 + warp + vec2(17.3, 9.1));
  float fl = mix(l2, l1, w1);
  float occl = clamp((fl - f) * 3.0, 0.0, 1.0);  // sitting in another fold's shadow
  float face = clamp((f - fl) * 3.0, 0.0, 1.0);  // turned toward the light

  // clouds soften contrast (u_contrast blended in JS); rain flattens and cools
  float fc = pow(clamp(f, 0.0, 1.0), u_contrast);

  vec3 day = pal(fc, u_dayA, u_dayB, vec3(1.0), u_dayD);
  vec3 night = pal(fc, u_nightA, u_nightB, vec3(1.0), u_nightD);
  vec3 col = mix(day, night, u_night);

  // the volume's own light, applied before the atmosphere layers over it
  float sh = u_shade * (1.0 - u_soft * 0.45);
  col *= 1.0 - sh * (occl - face * 0.75);

  // deep currents darken, fast eddies glow
  col = mix(col, col * vec3(0.35, 0.38, 0.45), clamp(length(q) * 0.55, 0.0, 1.0) * (1.0 - u_night * 0.4));
  col += vec3(0.10, 0.09, 0.07) * (1.0 - u_night) * smoothstep(0.45, 0.85, r.x) * (1.0 - u_soft * 0.5);
  col += vec3(0.04, 0.07, 0.10) * u_night * smoothstep(0.5, 0.9, r.y);

  // temperature tint
  col *= mix(u_tintCool, u_tintWarm, u_warmth * 0.5 + 0.5);

  // rain: cool grey wash and a slow falling shimmer
  float shimmer = noise(vec2(gl_FragCoord.x * 0.7, gl_FragCoord.y * 0.06 + u_time * 3.5));
  col = mix(col, vec3(dot(col, vec3(0.299, 0.587, 0.114))) * vec3(0.82, 0.88, 1.0), u_wet * 0.35);
  col += u_wet * 0.03 * shimmer;

  // clear dark nights: stars peek through the thin parts of the ink
  float starVis = u_night * u_night * (1.0 - u_soft) * (1.0 - u_wet) * (1.0 - u_snow);
  vec2 sp = uv * 24.0;
  vec2 sid = floor(sp);
  vec2 sf = fract(sp) - 0.5;
  float srnd = hash(sid);
  vec2 soff = (vec2(srnd, fract(srnd * 34.7)) - 0.5) * 0.7;
  float twinkle = 0.65 + 0.35 * sin(u_time * (0.2 + 0.5 * srnd) + srnd * 41.0);
  float star = (1.0 - smoothstep(0.02, u_starSize, length(sf - soff))) * step(u_starThresh, srnd) * twinkle;
  col += star * starVis * smoothstep(0.68, 0.28, f) * u_starTint;

  // snow: hushed pale wash and three parallax layers of drifting flakes
  col = mix(col, col * 0.55 + vec3(0.30, 0.32, 0.37), u_snow * u_snowWash);
  float flakes = snowLayer(uv, 5.0, u_time * 0.27, 0.16)
    + snowLayer(uv, 8.0, u_time * 0.20, 0.13) * 0.7
    + snowLayer(uv, 13.0, u_time * 0.14, 0.11) * 0.45;
  col += clamp(flakes, 0.0, 1.0) * u_snow * u_snowTint;

  // vignette and a static fine grain (breaks banding without flicker)
  col *= 1.0 - u_vig * dot(uv * 0.72, uv * 0.72);
  col += (hash(gl_FragCoord.xy) - 0.5) * u_grain;

  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
"use strict";

// --- configuration -------------------------------------------------------
const params = new URLSearchParams(location.search);
const LAT = parseFloat(params.get("lat") || "59.3293");   // default: Stockholm
const LON = parseFloat(params.get("lon") || "18.0686");
const WEATHER_REFRESH_MS = 15 * 60 * 1000;
const MOOD_TAU_S = 45;   // seconds for a mood change to settle — imperceptibly slow
const GENOME_REFRESH_MS = 60 * 60 * 1000;
const GENOME_TAU_S = 60; // a new genome fades in over a couple of minutes

// --- genome: the mutable DNA (see genome.json, CONSTITUTION.md) -------------
// This fallback copy is the organism's survival guarantee: if genome.json is
// missing, broken, or unreachable, this is what keeps living on screen.
//
// It is also the *cold start*: G begins here on every load and lerps toward the
// fetched genome over GENOME_TAU_S. So a stale fallback is not just an offline
// risk — it is what the room sees for the first minutes of every single load.
// MUST be kept byte-for-byte in step with genome.json. Every mutation that
// changes a genome value changes this too, in the same commit. See EVOLVE.md.
const DEFAULT_GENOME = {
  generation: 6,
  species: "ink",
  breath: [
    { period: 7.3, amp: 0.26, phase: 0.0 },
    { period: 11.9, amp: 0.15, phase: 1.7 },
    { period: 28.6, amp: 0.09, phase: 4.2 }
  ],
  palette: {
    day:   { a: [0.54, 0.40, 0.46], b: [0.42, 0.28, 0.32], d: [0.00, 0.15, 0.18] },
    night: { a: [0.09, 0.11, 0.16], b: [0.14, 0.18, 0.24], d: [0.56, 0.63, 0.71] },
    warmTint: [1.08, 0.97, 0.98],
    coolTint: [0.94, 0.98, 1.07]
  },
  motion: {
    flowRate: 0.03, warpBase: 0.85, warpBreath: 0.18,
    warpPush: 1.5, expansionRate: 0.012, expansionRange: 0.6
  },
  look: { contrastCrisp: 1.45, contrastSoft: 1.08, vignette: 0.28, grain: 0.02 },
  form: { shade: 0.50 },
  stars: { threshold: 0.935, size: 0.115, tint: [1.0, 1.05, 1.25] },
  snow: { wash: 0.45, tint: [0.85, 0.89, 0.98] },
  weather: {
    flowBase: 0.5, flowWind: 0.9, warpBaseMood: 0.75,
    warpWind: 0.85, warmthPivot: 8, warmthScale: 22
  }
};

const clone = (o) => JSON.parse(JSON.stringify(o));
let G = clone(DEFAULT_GENOME);   // what renders right now
let Gt = clone(DEFAULT_GENOME);  // what it is drifting toward

// take incoming values only where they are sane; keep the reference otherwise
function saneMerge(incoming, ref) {
  if (typeof ref === "number") {
    return typeof incoming === "number" && isFinite(incoming) ? incoming : ref;
  }
  if (Array.isArray(ref)) return ref.map((v, i) => saneMerge(incoming && incoming[i], v));
  if (typeof ref === "object") {
    const out = {};
    for (const k in ref) out[k] = saneMerge(incoming && incoming[k], ref[k]);
    return out;
  }
  return typeof incoming === typeof ref ? incoming : ref;
}

function lerpGenome(cur, tgt, k) {
  for (const key in tgt) {
    const t = tgt[key];
    if (key === "generation" || typeof t === "string") cur[key] = t;
    else if (typeof t === "number") cur[key] += (t - cur[key]) * k;
    else lerpGenome(cur[key], t, k);
  }
}

async function fetchGenome() {
  try {
    const res = await fetch(`genome.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) return;
    Gt = saneMerge(await res.json(), DEFAULT_GENOME);
    if (lastWeather) applyWeather(lastWeather);
  } catch (err) {
    console.warn("genome unreachable, living on the current one", err);
  }
}

// --- webgl setup ----------------------------------------------------------
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl", { antialias: false, alpha: false, powerPreference: "high-performance" });
const hud = document.getElementById("hud");

if (!gl) {
  hud.textContent = "webgl not available on this display";
  throw new Error("no webgl");
}

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(s));
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER,
  "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }"));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById("frag").textContent));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  throw new Error(gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const U = {};
for (const name of ["u_res", "u_time", "u_flow", "u_warp", "u_warmth", "u_soft", "u_wet",
  "u_snow", "u_night", "u_wmul", "u_dayA", "u_dayB", "u_dayD", "u_nightA", "u_nightB",
  "u_nightD", "u_tintWarm", "u_tintCool", "u_starTint", "u_snowTint", "u_flowRate",
  "u_warpPush", "u_expRate", "u_expRange", "u_contrast", "u_vig", "u_grain",
  "u_starThresh", "u_starSize", "u_snowWash", "u_shade"]) {
  U[name] = gl.getUniformLocation(prog, name);
}

// --- mood: current state drifts toward targets ----------------------------
// neutral starting mood so the first minutes look good even with no network
const mood = { flow: 0.8, warp: 1.0, warmth: 0.0, soft: 0.4, wet: 0.0, snow: 0.0, night: 0.3 };
const target = { ...mood };
let moodLabel = "";
let sunTimes = null; // { sunrise: Date, sunset: Date }
let lastWeather = null;

function applyWeather(w) {
  lastWeather = w;
  const wind = w.wind_speed_10m ?? 10;          // km/h
  const temp = w.temperature_2m ?? 10;          // °C
  const cloud = w.cloud_cover ?? 50;            // %
  const precip = w.precipitation ?? 0;          // mm
  const snowfall = w.snowfall ?? 0;             // cm

  const gw = Gt.weather;
  target.flow = gw.flowBase + Math.min(wind / 40, 1) * gw.flowWind;
  target.warp = gw.warpBaseMood + Math.min(wind / 50, 1) * gw.warpWind;
  target.warmth = Math.max(-1, Math.min(1, (temp - gw.warmthPivot) / gw.warmthScale));
  target.soft = cloud / 100;
  target.snow = Math.max(0, Math.min(1, snowfall / 0.7));
  // snow replaces rain — precipitation includes the melted snow amount
  target.wet = target.snow > 0.05 ? 0 : Math.max(0, Math.min(1, precip / 1.5));

  moodLabel = `${Math.round(temp)}°  wind ${Math.round(wind)}  cloud ${Math.round(cloud)}%` +
    (snowfall > 0 ? "  snow" : precip > 0 ? "  rain" : "");
}

function updateNight() {
  const now = new Date();
  if (sunTimes) {
    // smooth 80-minute ramps centred on sunrise and sunset
    const ramp = 40 * 60 * 1000;
    const dawn = (now - sunTimes.sunrise) / ramp;
    const dusk = (now - sunTimes.sunset) / ramp;
    target.night = Math.min(1, Math.max(0, 1 - Math.max(0, Math.min(1, (dawn + 1) / 2))
      + Math.max(0, Math.min(1, (dusk + 1) / 2))));
  } else {
    // fallback: hour-of-day heuristic
    const h = now.getHours() + now.getMinutes() / 60;
    target.night = h < 5 || h > 22 ? 1 : h > 7 && h < 20 ? 0
      : h <= 7 ? (7 - h) / 2 : (h - 20) / 2;
  }
}

async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
      `&current=temperature_2m,wind_speed_10m,cloud_cover,precipitation,snowfall` +
      `&daily=sunrise,sunset&timezone=auto&forecast_days=1`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`weather http ${res.status}`);
    const data = await res.json();
    applyWeather(data.current || {});
    if (data.daily && data.daily.sunrise && data.daily.sunset) {
      sunTimes = {
        sunrise: new Date(data.daily.sunrise[0]),
        sunset: new Date(data.daily.sunset[0]),
      };
    }
    showHud(moodLabel);
  } catch (err) {
    console.warn("weather unavailable, drifting on internal mood", err);
    showHud("offline · internal weather");
  }
}

// debug/preview overrides: ?night=1&wind=40&temp=-5&cloud=90&rain=1
function applyOverrides() {
  const o = (k) => params.has(k) ? parseFloat(params.get(k)) : null;
  if (o("night") !== null) { target.night = o("night"); sunTimes = { frozen: true, sunrise: 0, sunset: 0 }; }
  if (o("wind") !== null) { target.flow = 0.5 + Math.min(o("wind") / 40, 1) * 0.9; target.warp = 0.75 + Math.min(o("wind") / 50, 1) * 0.85; }
  if (o("temp") !== null) target.warmth = Math.max(-1, Math.min(1, (o("temp") - 8) / 22));
  if (o("cloud") !== null) target.soft = o("cloud") / 100;
  if (o("rain") !== null) target.wet = o("rain");
  if (o("snow") !== null) target.snow = o("snow");
  if (o("fast") !== null) { for (const k in target) mood[k] = target[k]; } // skip the slow drift
}
const hasOverrides = ["night", "wind", "temp", "cloud", "rain", "snow"].some((k) => params.has(k));

// --- hud ------------------------------------------------------------------
let hudTimer = null;
function showHud(text) {
  hud.textContent = text;
  hud.classList.remove("hidden");
  clearTimeout(hudTimer);
  hudTimer = setTimeout(() => hud.classList.add("hidden"), 8000);
}

document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "f") {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  } else if (k === "h") {
    showHud(`${moodLabel || "no weather yet"} · gen ${Gt.generation}`);
  }
});

// --- adaptive resolution: keep 60fps on weak TV browsers -------------------
let scale = 0.6;                 // internal render scale, adapted from fps
let frameTimes = [];
let lastAdapt = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = Math.max(2, Math.round(canvas.clientWidth * dpr * scale));
  canvas.height = Math.max(2, Math.round(canvas.clientHeight * dpr * scale));
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener("resize", resize);
resize();

// --- main loop --------------------------------------------------------------
const t0 = performance.now();
let last = t0;

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  // exponential drift of mood toward targets — the organism never jumps
  const k = 1 - Math.exp(-dt / MOOD_TAU_S);
  for (const key in mood) mood[key] += (target[key] - mood[key]) * k;

  // a fresh genome drifts in just as slowly as a mood change
  lerpGenome(G, Gt, 1 - Math.exp(-dt / GENOME_TAU_S));

  // breathing from incommensurate periods — calm, but never repeating
  const ts = (now - t0) / 1000;
  let breath = 0.5;
  for (const o of G.breath) breath += o.amp * Math.sin(ts * 2 * Math.PI / o.period + o.phase);
  breath = Math.max(0, Math.min(1, breath));

  const v3 = (n, a) => gl.uniform3f(U[n], a[0], a[1], a[2]);
  gl.uniform2f(U.u_res, canvas.width, canvas.height);
  gl.uniform1f(U.u_time, ts);
  gl.uniform1f(U.u_flow, mood.flow);
  gl.uniform1f(U.u_warp, mood.warp);
  gl.uniform1f(U.u_warmth, mood.warmth);
  gl.uniform1f(U.u_soft, mood.soft);
  gl.uniform1f(U.u_wet, mood.wet);
  gl.uniform1f(U.u_snow, mood.snow);
  gl.uniform1f(U.u_night, mood.night);
  gl.uniform1f(U.u_wmul, G.motion.warpBase + G.motion.warpBreath * breath);
  v3("u_dayA", G.palette.day.a); v3("u_dayB", G.palette.day.b); v3("u_dayD", G.palette.day.d);
  v3("u_nightA", G.palette.night.a); v3("u_nightB", G.palette.night.b); v3("u_nightD", G.palette.night.d);
  v3("u_tintWarm", G.palette.warmTint); v3("u_tintCool", G.palette.coolTint);
  v3("u_starTint", G.stars.tint); v3("u_snowTint", G.snow.tint);
  gl.uniform1f(U.u_flowRate, G.motion.flowRate);
  gl.uniform1f(U.u_warpPush, G.motion.warpPush);
  gl.uniform1f(U.u_expRate, G.motion.expansionRate);
  gl.uniform1f(U.u_expRange, G.motion.expansionRange);
  gl.uniform1f(U.u_contrast, G.look.contrastCrisp + (G.look.contrastSoft - G.look.contrastCrisp) * mood.soft);
  gl.uniform1f(U.u_vig, G.look.vignette);
  gl.uniform1f(U.u_grain, G.look.grain);
  gl.uniform1f(U.u_starThresh, G.stars.threshold);
  gl.uniform1f(U.u_starSize, G.stars.size);
  gl.uniform1f(U.u_snowWash, G.snow.wash);
  gl.uniform1f(U.u_shade, G.form.shade);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // fps governor
  frameTimes.push(dt);
  if (now - lastAdapt > 2000) {
    const avg = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length;
    const fps = 1 / avg;
    if (fps < 45 && scale > 0.3) { scale *= 0.85; resize(); }
    else if (fps > 57 && scale < 1.0) { scale = Math.min(1, scale * 1.08); resize(); }
    frameTimes = [];
    lastAdapt = now;
  }

  requestAnimationFrame(frame);
}

// --- start ------------------------------------------------------------------
fetchGenome();
setInterval(fetchGenome, GENOME_REFRESH_MS);

// debug handle for evolve-ritual validation and console experiments
window.stillLiving = {
  genome: () => clone(G),
  apply: (g, fast) => { Gt = saneMerge(g, Gt); if (fast) G = clone(Gt); },
  reload: fetchGenome
};

if (!hasOverrides) {
  updateNight();
  fetchWeather();
  setInterval(fetchWeather, WEATHER_REFRESH_MS);
  setInterval(() => { if (!sunTimes || !sunTimes.frozen) updateNight(); }, 60 * 1000);
} else {
  applyOverrides();
  showHud("override mood");
}
requestAnimationFrame(frame);
</script>
