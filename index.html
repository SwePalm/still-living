<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>still living</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #04050a;
    overflow: hidden;
    font-family: "Inter", system-ui, sans-serif;
    cursor: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .hud {
    position: fixed;
    bottom: 28px;
    left: 32px;
    color: rgba(255, 255, 255, 0.55);
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: lowercase;
    transition: opacity 3s ease;
    pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
  .hud.hidden { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud">waking up…</div>

<script id="frag" type="x-shader/x-fragment">
precision highp float;

uniform vec2  u_res;
uniform float u_time;
uniform float u_flow;    // overall tempo (wind)
uniform float u_warp;    // turbulence (wind)
uniform float u_warmth;  // -1 cold .. +1 warm (temperature)
uniform float u_soft;    // 0 crisp .. 1 soft (cloud cover)
uniform float u_wet;     // 0 dry .. 1 raining (precipitation)
uniform float u_night;   // 0 day .. 1 night (sun position)

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
    mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
    u.y);
}

float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
  for (int i = 0; i < 5; i++) {
    v += a * noise(p);
    p = rot * p * 2.02;
    a *= 0.5;
  }
  return v;
}

vec3 pal(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
  return a + b * cos(6.28318 * (c * t + d));
}

void main() {
  vec2 uv = (gl_FragCoord.xy * 2.0 - u_res) / min(u_res.x, u_res.y);
  float t = u_time * 0.03 * u_flow;

  // ~7 second breathing cycle modulating the turbulence
  float breath = 0.5 + 0.5 * sin(u_time * 0.897);
  float w = u_warp * (0.85 + 0.18 * breath);

  // two-stage domain warp: the flow field the organism lives in
  vec2 q = vec2(
    fbm(uv + vec2(0.0, t)),
    fbm(uv + vec2(5.2, 1.3) - t * 0.71));
  vec2 r = vec2(
    fbm(uv + w * q + vec2(1.7, 9.2) + 0.150 * t),
    fbm(uv + w * q + vec2(8.3, 2.8) - 0.126 * t));
  float f = fbm(uv + w * r * 1.5);

  // clouds soften contrast; rain flattens and cools
  float contrast = mix(1.45, 0.95, u_soft);
  float fc = pow(clamp(f, 0.0, 1.0), contrast);

  // day: ochre, slate blue, warm ivory — night: deep ink and cold teal
  vec3 day = pal(fc,
    vec3(0.46, 0.42, 0.38),
    vec3(0.38, 0.32, 0.28),
    vec3(1.0),
    vec3(0.02, 0.12, 0.28));
  vec3 night = pal(fc,
    vec3(0.09, 0.11, 0.15),
    vec3(0.11, 0.15, 0.21),
    vec3(1.0),
    vec3(0.55, 0.62, 0.72));
  vec3 col = mix(day, night, u_night);

  // deep currents darken, fast eddies glow
  col = mix(col, col * vec3(0.35, 0.38, 0.45), clamp(length(q) * 0.55, 0.0, 1.0) * (1.0 - u_night * 0.4));
  col += vec3(0.10, 0.09, 0.07) * (1.0 - u_night) * smoothstep(0.45, 0.85, r.x) * (1.0 - u_soft * 0.5);
  col += vec3(0.04, 0.07, 0.10) * u_night * smoothstep(0.5, 0.9, r.y);

  // temperature tint
  col *= mix(vec3(0.94, 0.98, 1.07), vec3(1.07, 1.00, 0.92), u_warmth * 0.5 + 0.5);

  // rain: cool grey wash and a fine falling shimmer
  float shimmer = noise(vec2(gl_FragCoord.x * 0.7, gl_FragCoord.y * 0.12 + u_time * 9.0));
  col = mix(col, vec3(dot(col, vec3(0.299, 0.587, 0.114))) * vec3(0.82, 0.88, 1.0), u_wet * 0.35);
  col += u_wet * 0.05 * shimmer;

  // vignette and film grain (hides banding on TVs)
  col *= 1.0 - 0.28 * dot(uv * 0.72, uv * 0.72);
  col += (hash(gl_FragCoord.xy + fract(u_time) * 100.0) - 0.5) * 0.035;

  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
"use strict";

// --- configuration -------------------------------------------------------
const params = new URLSearchParams(location.search);
const LAT = parseFloat(params.get("lat") || "59.3293");   // default: Stockholm
const LON = parseFloat(params.get("lon") || "18.0686");
const WEATHER_REFRESH_MS = 15 * 60 * 1000;
const MOOD_TAU_S = 45;   // seconds for a mood change to settle — imperceptibly slow

// --- webgl setup ----------------------------------------------------------
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl", { antialias: false, alpha: false, powerPreference: "high-performance" });
const hud = document.getElementById("hud");

if (!gl) {
  hud.textContent = "webgl not available on this display";
  throw new Error("no webgl");
}

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(s));
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER,
  "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }"));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById("frag").textContent));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  throw new Error(gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const U = {};
for (const name of ["u_res", "u_time", "u_flow", "u_warp", "u_warmth", "u_soft", "u_wet", "u_night"]) {
  U[name] = gl.getUniformLocation(prog, name);
}

// --- mood: current state drifts toward targets ----------------------------
// neutral starting mood so the first minutes look good even with no network
const mood = { flow: 0.8, warp: 1.0, warmth: 0.0, soft: 0.4, wet: 0.0, night: 0.3 };
const target = { ...mood };
let moodLabel = "";
let sunTimes = null; // { sunrise: Date, sunset: Date }

function applyWeather(w) {
  const wind = w.wind_speed_10m ?? 10;          // km/h
  const temp = w.temperature_2m ?? 10;          // °C
  const cloud = w.cloud_cover ?? 50;            // %
  const precip = w.precipitation ?? 0;          // mm

  target.flow = 0.5 + Math.min(wind / 40, 1) * 0.9;
  target.warp = 0.75 + Math.min(wind / 50, 1) * 0.85;
  target.warmth = Math.max(-1, Math.min(1, (temp - 8) / 22));
  target.soft = cloud / 100;
  target.wet = Math.max(0, Math.min(1, precip / 1.5));

  moodLabel = `${Math.round(temp)}°  wind ${Math.round(wind)}  cloud ${Math.round(cloud)}%` +
    (precip > 0 ? "  rain" : "");
}

function updateNight() {
  const now = new Date();
  if (sunTimes) {
    // smooth 80-minute ramps centred on sunrise and sunset
    const ramp = 40 * 60 * 1000;
    const dawn = (now - sunTimes.sunrise) / ramp;
    const dusk = (now - sunTimes.sunset) / ramp;
    target.night = Math.min(1, Math.max(0, 1 - Math.max(0, Math.min(1, (dawn + 1) / 2))
      + Math.max(0, Math.min(1, (dusk + 1) / 2))));
  } else {
    // fallback: hour-of-day heuristic
    const h = now.getHours() + now.getMinutes() / 60;
    target.night = h < 5 || h > 22 ? 1 : h > 7 && h < 20 ? 0
      : h <= 7 ? (7 - h) / 2 : (h - 20) / 2;
  }
}

async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
      `&current=temperature_2m,wind_speed_10m,cloud_cover,precipitation` +
      `&daily=sunrise,sunset&timezone=auto&forecast_days=1`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`weather http ${res.status}`);
    const data = await res.json();
    applyWeather(data.current || {});
    if (data.daily && data.daily.sunrise && data.daily.sunset) {
      sunTimes = {
        sunrise: new Date(data.daily.sunrise[0]),
        sunset: new Date(data.daily.sunset[0]),
      };
    }
    showHud(moodLabel);
  } catch (err) {
    console.warn("weather unavailable, drifting on internal mood", err);
    showHud("offline · internal weather");
  }
}

// debug/preview overrides: ?night=1&wind=40&temp=-5&cloud=90&rain=1
function applyOverrides() {
  const o = (k) => params.has(k) ? parseFloat(params.get(k)) : null;
  if (o("night") !== null) { target.night = o("night"); sunTimes = { frozen: true, sunrise: 0, sunset: 0 }; }
  if (o("wind") !== null) { target.flow = 0.5 + Math.min(o("wind") / 40, 1) * 0.9; target.warp = 0.75 + Math.min(o("wind") / 50, 1) * 0.85; }
  if (o("temp") !== null) target.warmth = Math.max(-1, Math.min(1, (o("temp") - 8) / 22));
  if (o("cloud") !== null) target.soft = o("cloud") / 100;
  if (o("rain") !== null) target.wet = o("rain");
  if (o("fast") !== null) { for (const k in target) mood[k] = target[k]; } // skip the slow drift
}
const hasOverrides = ["night", "wind", "temp", "cloud", "rain"].some((k) => params.has(k));

// --- hud ------------------------------------------------------------------
let hudTimer = null;
function showHud(text) {
  hud.textContent = text;
  hud.classList.remove("hidden");
  clearTimeout(hudTimer);
  hudTimer = setTimeout(() => hud.classList.add("hidden"), 8000);
}

document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "f") {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  } else if (k === "h") {
    showHud(moodLabel || "no weather yet");
  }
});

// --- adaptive resolution: keep 60fps on weak TV browsers -------------------
let scale = 0.6;                 // internal render scale, adapted from fps
let frameTimes = [];
let lastAdapt = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = Math.max(2, Math.round(canvas.clientWidth * dpr * scale));
  canvas.height = Math.max(2, Math.round(canvas.clientHeight * dpr * scale));
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener("resize", resize);
resize();

// --- main loop --------------------------------------------------------------
const t0 = performance.now();
let last = t0;

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  // exponential drift of mood toward targets — the organism never jumps
  const k = 1 - Math.exp(-dt / MOOD_TAU_S);
  for (const key in mood) mood[key] += (target[key] - mood[key]) * k;

  gl.uniform2f(U.u_res, canvas.width, canvas.height);
  gl.uniform1f(U.u_time, (now - t0) / 1000);
  gl.uniform1f(U.u_flow, mood.flow);
  gl.uniform1f(U.u_warp, mood.warp);
  gl.uniform1f(U.u_warmth, mood.warmth);
  gl.uniform1f(U.u_soft, mood.soft);
  gl.uniform1f(U.u_wet, mood.wet);
  gl.uniform1f(U.u_night, mood.night);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // fps governor
  frameTimes.push(dt);
  if (now - lastAdapt > 2000) {
    const avg = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length;
    const fps = 1 / avg;
    if (fps < 45 && scale > 0.3) { scale *= 0.85; resize(); }
    else if (fps > 57 && scale < 1.0) { scale = Math.min(1, scale * 1.08); resize(); }
    frameTimes = [];
    lastAdapt = now;
  }

  requestAnimationFrame(frame);
}

// --- start ------------------------------------------------------------------
if (!hasOverrides) {
  updateNight();
  fetchWeather();
  setInterval(fetchWeather, WEATHER_REFRESH_MS);
  setInterval(() => { if (!sunTimes || !sunTimes.frozen) updateNight(); }, 60 * 1000);
} else {
  applyOverrides();
  showHud("override mood");
}
requestAnimationFrame(frame);
</script>
</body>
</html>
